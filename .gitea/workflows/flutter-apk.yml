name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze:
    name: Static Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit and widget tests
        run: flutter test

  build_release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs:
      - analyze
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release artifact
        id: upload_apk
        uses: actions/upload-artifact@v3
        with:
          name: flutter_offline_music_${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Generate release notes from commits
        id: release_notes
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"

          if [ -n "$PREV_TAG" ]; then
            NOTES="$(git log --pretty=format:'- %s (%h)' "${PREV_TAG}..${GITHUB_SHA}")"
          else
            NOTES="$(git log --pretty=format:'- %s (%h)' "${GITHUB_SHA}")"
          fi

          if [ -z "$NOTES" ]; then
            NOTES="- No commit messages found."
          fi

          {
            echo "previous_tag=$PREV_TAG"
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Gitea Release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.release_notes.outputs.previous_tag }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        shell: bash
        run: |
          set -e

          API_URL="${GITEA_SERVER_URL}/api/v1"
          REPO="${GITEA_REPOSITORY}"

          echo "Creating release ${RELEASE_TAG}"

          curl \
            -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API_URL}/repos/${REPO}/releases" \
            -d @- <<EOF
          {
            "tag_name": "${RELEASE_TAG}",
            "name": "Release ${RELEASE_TAG}",
            "body": "Changes since previous release \`${PREVIOUS_TAG:-N/A}\`:\n\n${RELEASE_NOTES}"
          }
          EOF

      - name: Upload APK to Gitea Release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e

          API_URL="${GITEA_SERVER_URL}/api/v1"
          REPO="${GITEA_REPOSITORY}"

          echo "Getting release ID..."

          RELEASE_ID=$(curl -fsSL \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${API_URL}/repos/${REPO}/releases/tags/${RELEASE_TAG}" \
            | jq -r '.id')

          echo "Release ID: ${RELEASE_ID}"

          echo "Uploading APK..."

          curl -fsSL \
            -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -F "attachment=@build/app/outputs/flutter-apk/app-release.apk" \
            "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=app-release.apk"

          echo "APK uploaded successfully."
